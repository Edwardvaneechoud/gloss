[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "glosslayer-flowfile"
version = "0.2.0"
description = "Gloss plugin for the Flowfile catalog: catalog seam plus lineage-based proposals."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Gloss contributors" }]
keywords = ["semantic-layer", "ossie", "flowfile", "data-catalog", "lineage", "metadata"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Database",
]
dependencies = ["glosslayer>=0.2.0,<0.3"]

[project.urls]
Homepage = "https://github.com/Edwardvaneechoud/glosslayer"
Repository = "https://github.com/Edwardvaneechoud/glosslayer"
Issues = "https://github.com/Edwardvaneechoud/glosslayer/issues"
Changelog = "https://github.com/Edwardvaneechoud/glosslayer/blob/main/CHANGELOG.md"

[project.entry-points."gloss.catalogs"]
flowfile = "glosslayer_flowfile:FlowfileCatalog"

[project.entry-points."gloss.sources"]
flowfile-lineage = "glosslayer_flowfile:LineageSource"

[tool.hatch.build.targets.wheel]
packages = ["src/glosslayer_flowfile"]
