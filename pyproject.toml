[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gloss-semantics"
version = "0.1.0.dev0"
description = "A catalog-agnostic semantic layer: track, review, visualize and serve Apache Ossie semantic models."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Gloss contributors" }]
keywords = ["semantic-layer", "ossie", "data-catalog", "metadata", "llm", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
validate = ["jsonschema>=4.18"]
checks = ["polars>=1.0"]
postgres = ["psycopg[binary]>=3.1"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
mcp = ["mcp>=1.2"]
all = ["gloss-semantics[validate,checks,postgres,server,mcp]"]
dev = ["gloss-semantics[validate,checks,server,mcp]", "pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
gloss = "gloss.cli:main"

# Built-in plugins are registered through the same entry points third parties use.
[project.entry-points."gloss.catalogs"]
file = "gloss.catalogs.file:FileCatalog"

[project.entry-points."gloss.sources"]
ossie = "gloss.ossie.importer:OssieSource"
semantic-types = "gloss.semantic:TypeSuggester"

[project.entry-points."gloss.sinks"]
ossie = "gloss.ossie.exporter:OssieSink"
git = "gloss.sinks:GitSink"

[tool.hatch.build.targets.wheel]
packages = ["src/gloss"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "scripts", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests", "plugins/gloss-flowfile/tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008"]
