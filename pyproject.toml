[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "glosslayer"
version = "0.2.0"
description = "A catalog-agnostic semantic layer: track, review, visualize and serve Apache Ossie semantic models."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Gloss contributors" }]
keywords = ["semantic-layer", "ossie", "data-catalog", "metadata", "llm", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Database",
]
dependencies = [
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Edwardvaneechoud/glosslayer"
Repository = "https://github.com/Edwardvaneechoud/glosslayer"
Issues = "https://github.com/Edwardvaneechoud/glosslayer/issues"
Changelog = "https://github.com/Edwardvaneechoud/glosslayer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
validate = ["jsonschema>=4.18"]
checks = ["polars>=1.0"]
postgres = ["psycopg[binary]>=3.1"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
mcp = ["mcp>=1.22"]
all = ["glosslayer[validate,checks,postgres,server,mcp]"]
dev = ["glosslayer[validate,checks,server,mcp]", "pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
gloss = "glosslayer.cli:main"

# Built-in plugins are registered through the same entry points third parties use.
[project.entry-points."gloss.catalogs"]
file = "glosslayer.catalogs.file:FileCatalog"

[project.entry-points."gloss.sources"]
ossie = "glosslayer.ossie.importer:OssieSource"
semantic-types = "glosslayer.semantic:TypeSuggester"

[project.entry-points."gloss.sinks"]
ossie = "glosslayer.ossie.exporter:OssieSink"
git = "glosslayer.sinks:GitSink"

[tool.hatch.build.targets.wheel]
packages = ["src/glosslayer"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/scripts", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests", "plugins/glosslayer-flowfile/tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008"]
