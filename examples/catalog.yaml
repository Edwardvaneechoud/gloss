# A tiny catalog for the built-in `file` catalog plugin.
# Try: gloss sync file:examples/catalog.yaml
name: shop
assets:
  shop.orders:
    description: Orders placed in the web shop
    primary_key: [order_id]
    columns:
      - {name: order_id, dtype: Int64}
      - {name: customer_id, dtype: Int64}
      - {name: order_date, dtype: Date}
      - {name: amount, dtype: "Decimal(18,2)"}
      - {name: status, dtype: Utf8}
      - {name: created_at, dtype: "Datetime(time_unit='us', time_zone='UTC')"}
  shop.customers:
    primary_key: [customer_id]
    columns:
      - {name: customer_id, dtype: Int64}
      - {name: name, dtype: Utf8}
      - {name: email, dtype: Utf8}
      - {name: country, dtype: Utf8}
      - {name: signup_date, dtype: Date}
