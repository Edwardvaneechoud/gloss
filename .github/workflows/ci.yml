name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]" -e plugins/gloss-flowfile duckdb
      - run: ruff check src plugins tests scripts examples --select E,F,W,B --ignore E501,B008
      - run: pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: gloss
          POSTGRES_DB: gloss
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GLOSS_TEST_DATABASE_URL: postgresql+psycopg://postgres:gloss@localhost:5432/gloss
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]" -e plugins/gloss-flowfile duckdb
      - run: pytest -q

  core-only:
    name: core without extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -c "import gloss; g = gloss.open('sqlite://'); print(gloss.__version__, gloss.schema.current_version(g.store.engine))"
      - run: gloss --db sqlite:///ci.db sync file:examples/catalog.yaml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build && python -m build plugins/gloss-flowfile
      - run: |
          pip install dist/*.whl
          python -c 'from gloss.ossie.exporter import _schema; assert _schema()["$defs"]'
